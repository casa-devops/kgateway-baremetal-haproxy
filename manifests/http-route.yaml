apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpcheck
  namespace: kgateway-system
spec:
  parentRefs:
    - name: http-gateway
      namespace: kgateway-system
  hostnames:
    - kgatewayhttpcheck.example.corp
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpcheck
          port: 80
