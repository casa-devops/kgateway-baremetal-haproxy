#---------------------------------------------------------------------
# HAProxy 2.8 - par de load balancers (lb1/lb2) com keepalived, VIP 192.0.2.10.
# O arquivo deve ser idêntico nos dois servidores.
# Valide antes de reiniciar:  haproxy -c -f /tmp/haproxy.cfg.candidate
#
# Valores genéricos (substitua pelos do seu ambiente):
#   cp1..cp3          192.0.2.11 - 192.0.2.13   (control plane, :6443)
#   worker1..worker3  192.0.2.21 - 192.0.2.23   (HAProxy Ingress :8080/:8443, kgateway :30081)
#---------------------------------------------------------------------

global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option http-server-close
    option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

#---------------------------------------------------------------------
# Frontends
#---------------------------------------------------------------------
frontend k8smst
    mode tcp
    bind :6443
    option tcplog
    default_backend k8s-masters

frontend k8s-access-http
    mode http
    bind *:80
    option tcplog
    default_backend k8s-ingress-http

# TLS passthrough: o HAProxy Ingress termina o TLS no hostPort 8443.
frontend k8s-access-https
    mode tcp
    bind *:443
    option tcplog
    default_backend k8s-ingress-https

# kgateway (Gateway API) - Gateway kgateway-system/http-gateway, listener HTTP 8081.
# O kgateway roteia pelo header Host (HTTPRoute.spec.hostnames): repasse-o sem alteração.
# O Envoy responde 404 (server: envoy) para hosts sem HTTPRoute.
frontend k8s-access-kgateway
    mode http
    bind *:8081
    option httplog
    default_backend k8s-ingress-kgateway

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
backend k8s-masters
    mode tcp
    balance roundrobin
    option tcp-check
    server cp1 192.0.2.11:6443 check fall 3 rise 2
    server cp2 192.0.2.12:6443 check fall 3 rise 2
    server cp3 192.0.2.13:6443 check fall 3 rise 2

backend k8s-ingress-http
    balance roundrobin
    option tcp-check
    server worker1 192.0.2.21:8080 check fall 3 rise 2
    server worker2 192.0.2.22:8080 check fall 3 rise 2
    server worker3 192.0.2.23:8080 check fall 3 rise 2

backend k8s-ingress-https
    mode tcp
    balance roundrobin
    option tcp-check
    server worker1 192.0.2.21:8443 check fall 3 rise 2
    server worker2 192.0.2.22:8443 check fall 3 rise 2
    server worker3 192.0.2.23:8443 check fall 3 rise 2

# Service kgateway-system/http-gateway: NodePort 8081:30081 (mesma porta em todos os nós),
# com 3 pods Envoy, um por worker.
# Health check: sem um Host roteado o Envoy responde 404, e o readiness do proxy
# (:8082/ready) não é exposto pelo NodePort. Por isso o check usa um host dedicado:
# kgatewayhttpcheck.example.corp -> nginx /healthz ("OK")
# (manifests/kgateway-httpchck.yaml + manifests/http-route.yaml).
# Com externalTrafficPolicy: Cluster, qualquer nó encaminha para qualquer proxy saudável:
# check OK = "o nó alcança um proxy", não "o pod local está saudável".
backend k8s-ingress-kgateway
    mode http
    balance roundrobin
    # Sintaxe do HAProxy >= 2.2. A forma 1.8 "option httpchk GET / HTTP/1.1\r\nHost:\ ..."
    # é erro fatal de configuração no 2.8.
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host kgatewayhttpcheck.example.corp
    http-check expect status 200
    server worker1 192.0.2.21:30081 check inter 3s fall 3 rise 2
    server worker2 192.0.2.22:30081 check inter 3s fall 3 rise 2
    server worker3 192.0.2.23:30081 check inter 3s fall 3 rise 2
